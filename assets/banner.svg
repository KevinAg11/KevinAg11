  <text x="80" y="228" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold" fill="#f8fafc">TU NOMBRE</text>
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#e2e8f0">Desarrollador de software</text>
  <text x="80" y="354" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#94a3b8">SENA &#183; Tecn&#243;logo en An&#225;lisis y Desarrollo de Software</text>
