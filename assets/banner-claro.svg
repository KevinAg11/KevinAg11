<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Banner de ejemplo: TU NOMBRE, Desarrollador de software">
  <title>Banner de ejemplo (modo claro)</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#fondo)"/>
  <circle cx="1120" cy="60" r="200" fill="#0284c7" opacity="0.08"/>
  <circle cx="1220" cy="360" r="150" fill="#7c3aed" opacity="0.10"/>
  <circle cx="90" cy="380" r="120" fill="#0284c7" opacity="0.06"/>
  <g fill="none" stroke="#475569" stroke-opacity="0.3" stroke-width="2">
    <path d="M900 120 L860 200 L900 280"/>
    <path d="M1000 120 L1040 200 L1000 280"/>
    <path d="M965 105 L935 295"/>
  </g>
  <rect x="80" y="250" width="160" height="6" rx="3" fill="url(#acento)"/>
  <text x="80" y="170" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#475569" letter-spacing="6">PORTAFOLIO &#183; GITHUB</text>
  <text x="80" y="228" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold" fill="#0f172a">TU NOMBRE</text>
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#1e293b">Desarrollador de software</text>
  <text x="80" y="354" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#475569">SENA &#183; Tecn&#243;logo en An&#225;lisis y Desarrollo de Software</text>
</svg>
